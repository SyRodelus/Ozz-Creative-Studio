</ul>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const toggleBox = document.getElementById("OpenMenu");

    toggleBox.addEventListener("click", (e) => {
      // Busca el elemento .hamburger dentro del contenedor
      const hamburger = toggleBox.querySelector(".hamburger");

      if (hamburger) {
        hamburger.classList.toggle("active");

        // Opcional: Dispara eventos personalizados si es necesario
        const event = new Event("hamburger-toggle", { bubbles: true });
        hamburger.dispatchEvent(event);
      }
    });
  });
</script>
